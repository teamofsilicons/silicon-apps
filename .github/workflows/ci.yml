name: Check Silicon Apps

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apps-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust check and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      APPS_TELEMETRY_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.0"
          components: rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --locked
      - run: cargo test --workspace --locked
      - run: python3 scripts/test_uuid_backfill.py

  web:
    name: Web build and browser behavior
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chrome
      - run: npm test
      - name: Retain browser failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-traces
          path: |
            web/test-results/
            web/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  native-client:
    name: Native client contracts (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      APPS_TELEMETRY_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.0"
      - name: Install native Windows assembler dependency
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            choco install nasm --yes --no-progress
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -eq 3) { throw "NASM installation failed after three attempts" }
            Start-Sleep -Seconds 15
          }
          & "C:\Program Files\NASM\nasm.exe" -v
          if ($LASTEXITCODE -ne 0) { throw "NASM executable verification failed" }
          "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - run: cargo test -p silicon-apps-client -p silicon-apps-package -p silicon-apps-cli --locked

  runner:
    name: Worker safety tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: runner/requirements.txt
      - run: python -m pip install -r runner/requirements.txt
      - run: python -m unittest discover -s runner -v
      - name: Installer PATH and updater handoff regressions
        if: runner.os != 'Windows'
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: PowerShell installer syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path scripts/install.ps1), [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
      - name: Deployment rollback and bundle integrity
        if: runner.os == 'Linux'
        run: python -m unittest discover -s deploy -p 'test_*.py' -v
