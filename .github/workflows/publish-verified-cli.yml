name: Stage verified CLI release assets
on:
  workflow_dispatch:
    inputs:
      build_run:
        description: Successful native package build run
        required: true
        type: string
      source_commit:
        description: Exact source commit verified by that build
        required: true
        type: string
      version:
        description: Release version
        required: true
        type: string
permissions:
  contents: write
  actions: read
jobs:
  stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_COMMIT: ${{ inputs.source_commit }}
      BUILD_RUN: ${{ inputs.build_run }}
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_commit }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify completed build provenance
        run: |
          gh run view "$BUILD_RUN" --json conclusion,headSha,workflowName > /tmp/native-run.json
          python - <<'PY'
          import json,os,re
          r=json.load(open('/tmp/native-run.json'))
          assert r['conclusion']=='success' and r['headSha']==os.environ['SOURCE_COMMIT']
          assert r['workflowName']=='Build native CLI package artifacts'
          assert re.fullmatch(r'\d+\.\d+\.\d+',os.environ['RELEASE_VERSION'])
          PY
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.build_run }}
          pattern: apps-*-${{ inputs.source_commit }}
          path: native
          merge-multiple: true
      - name: Verify every archive and native report
        run: |
          python - <<'PY'
          import hashlib,importlib.util,json,os,pathlib,shutil
          root=pathlib.Path('native');reports=sorted(p.name for p in root.glob('*.verification.json'))
          metadata={'app_id':'silicon-apps','version':os.environ['RELEASE_VERSION'],'source_commit':os.environ['SOURCE_COMMIT'],'workflow':'https://github.com/teamofsilicons/silicon-apps/actions/runs/'+os.environ['BUILD_RUN'],'reports':reports}
          (root/'release.json').write_text(json.dumps(metadata,indent=2)+'\n')
          spec=importlib.util.spec_from_file_location('publisher','deploy/publish-first-party.py');m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)
          packages,_=m.verified_packages(root,metadata);assert len(packages)==9
          for name in ['install.sh','install.ps1']:shutil.copy2(pathlib.Path('scripts')/name,root/name)
          (root/'SHA256SUMS').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n' for p in sorted(root.iterdir()) if p.name!='SHA256SUMS'))
          PY
      - name: Stage assets on the draft release
        run: |
          gh release view "v$RELEASE_VERSION" --json isDraft > /tmp/release.json
          python - <<'PY'
          import json
          assert json.load(open('/tmp/release.json'))['isDraft'] is True, 'Refuse to replace published assets'
          PY
          gh release upload "v$RELEASE_VERSION" native/* --clobber
