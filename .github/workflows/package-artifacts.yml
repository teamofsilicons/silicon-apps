name: Build native CLI package artifacts

# Archives stay reviewable workflow artifacts until the release is explicitly published.
on:
  workflow_dispatch:
    inputs:
      stage_release:
        description: Stage already verified packages on the draft GitHub release (skip builds)
        required: false
        type: boolean
        default: false
      release_version:
        description: Version to stage (requires reuse_run and reuse_commit)
        required: false
        type: string
      reuse_run:
        description: Optional completed build run ID whose exact archives should be reverified
        required: false
        type: string
      reuse_commit:
        description: Exact source commit of reused archives (required with reuse_run)
        required: false
        type: string

permissions:
  contents: read
  actions: read

jobs:
  build:
    if: ${{ !inputs.stage_release }}
    name: Package ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x86_64
            rust_target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04
            target: linux-i686
            rust_target: i686-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: linux-aarch64
            rust_target: aarch64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: linux-armv7hf
            rust_target: armv7-unknown-linux-gnueabihf
          - os: macos-15-intel
            target: macos-x86_64
            rust_target: x86_64-apple-darwin
          - os: macos-15
            target: macos-aarch64
            rust_target: aarch64-apple-darwin
          - os: windows-2022
            target: windows-x86_64
            rust_target: x86_64-pc-windows-msvc
          - os: windows-2022
            target: windows-i686
            rust_target: i686-pc-windows-msvc
          - os: windows-11-arm
            target: windows-aarch64
            rust_target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.reuse_commit || github.sha }}
      - name: Load the current verifier without changing the release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .release-tools
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.0"
          targets: ${{ matrix.rust_target }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install 32-bit Linux build support
        if: matrix.target == 'linux-i686'
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib
      - name: Install ARMv7 cross compiler and emulator
        if: matrix.target == 'linux-armv7hf'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabihf qemu-user
          echo 'CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER=arm-linux-gnueabihf-gcc' >> "$GITHUB_ENV"
          echo 'CC_armv7_unknown_linux_gnueabihf=arm-linux-gnueabihf-gcc' >> "$GITHUB_ENV"
          echo 'AR_armv7_unknown_linux_gnueabihf=arm-linux-gnueabihf-ar' >> "$GITHUB_ENV"
          echo 'APPS_VERIFY_RUNNER=["qemu-arm","-L","/usr/arm-linux-gnueabihf"]' >> "$GITHUB_ENV"
      - name: Make python3 available to the portable build helper on Windows
        if: runner.os == 'Windows'
        run: |
          mkdir -p "$RUNNER_TEMP/apps-python"
          cat > "$RUNNER_TEMP/apps-python/python3" <<'WRAPPER'
          #!/usr/bin/env bash
          exec python "$@"
          WRAPPER
          chmod +x "$RUNNER_TEMP/apps-python/python3"
          echo "$RUNNER_TEMP/apps-python" >> "$GITHUB_PATH"
      - name: Download exact archives from the original build
        id: download
        if: inputs.reuse_run != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.reuse_run }}
          name: apps-${{ matrix.target }}-${{ inputs.reuse_commit }}
          path: dist
      - name: Install the Windows x86 assembler when a package must be built
        if: runner.os == 'Windows' && matrix.target != 'windows-aarch64' && (inputs.reuse_run == '' || steps.download.outcome == 'failure')
        shell: pwsh
        run: |
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            choco install nasm --yes --no-progress
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -eq 3) { throw "NASM installation failed after three attempts" }
            Start-Sleep -Seconds 15
          }
          & "C:\Program Files\NASM\nasm.exe" -v
          if ($LASTEXITCODE -ne 0) { throw "NASM executable verification failed" }
          "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build package
        if: inputs.reuse_run == '' || steps.download.outcome == 'failure'
        env:
          PACKAGE_TARGET: ${{ matrix.target }}
        run: bash scripts/build-release.sh --target "$PACKAGE_TARGET" --output dist
      - name: Verify required discovery commands and retain their complete output
        env:
          PACKAGE_TARGET: ${{ matrix.target }}
          APPS_SOURCE_COMMIT: ${{ inputs.reuse_commit || github.sha }}
        run: python3 .release-tools/scripts/verify-release.py --target "$PACKAGE_TARGET" --directory dist
      - name: Retain verified archive, checksum and verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: apps-${{ matrix.target }}-${{ github.sha }}
          path: |
            dist/apps-*.tar.gz
            dist/apps-*.tar.gz.sha256
            dist/apps-*.verification.json
          if-no-files-found: error
          retention-days: 30

  stage:
    if: ${{ inputs.stage_release }}
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_COMMIT: ${{ inputs.reuse_commit }}
      BUILD_RUN: ${{ inputs.reuse_run }}
      RELEASE_VERSION: ${{ inputs.release_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.reuse_commit }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify completed build provenance
        run: |
          gh run view "$BUILD_RUN" --json conclusion,headSha,workflowName > /tmp/native-run.json
          python - <<'PY'
          import json,os,re
          r=json.load(open('/tmp/native-run.json'))
          assert r['conclusion']=='success' and r['headSha']==os.environ['SOURCE_COMMIT']
          assert r['workflowName']=='Build native CLI package artifacts'
          assert re.fullmatch(r'\d+\.\d+\.\d+',os.environ['RELEASE_VERSION'])
          PY
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.reuse_run }}
          pattern: apps-*-${{ inputs.reuse_commit }}
          path: native
          merge-multiple: true
      - name: Verify every archive and native report
        run: |
          python - <<'PY'
          import hashlib,importlib.util,json,os,pathlib,shutil
          root=pathlib.Path('native');reports=sorted(p.name for p in root.glob('*.verification.json'))
          metadata={'app_id':'silicon-apps','version':os.environ['RELEASE_VERSION'],'source_commit':os.environ['SOURCE_COMMIT'],'workflow':'https://github.com/teamofsilicons/silicon-apps/actions/runs/'+os.environ['BUILD_RUN'],'reports':reports}
          (root/'release.json').write_text(json.dumps(metadata,indent=2)+'\n')
          spec=importlib.util.spec_from_file_location('publisher','deploy/publish-first-party.py');m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)
          packages,_=m.verified_packages(root,metadata);assert len(packages)==9
          for name in ['install.sh','install.ps1']:shutil.copy2(pathlib.Path('scripts')/name,root/name)
          (root/'SHA256SUMS').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n' for p in sorted(root.iterdir()) if p.name!='SHA256SUMS'))
          PY
      - name: Stage assets on the draft release
        run: |
          gh release view "v$RELEASE_VERSION" --json isDraft > /tmp/release.json
          python - <<'PY'
          import json
          assert json.load(open('/tmp/release.json'))['isDraft'] is True, 'Refuse to replace published assets'
          PY
          gh release upload "v$RELEASE_VERSION" native/* --clobber
