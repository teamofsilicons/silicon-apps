name: Build native API artifact

on:
  pull_request:
    paths:
      - crates/server/**
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/server-artifact.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server:
    name: API for production Linux ARM64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    env:
      CARGO_TERM_COLOR: always
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_RELEASE_DEBUG: "0"
      SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.0"
          targets: aarch64-unknown-linux-gnu
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned production linker
        run: |
          # The ARM runner is native. Zig keeps its glibc requirement compatible
          # with the Amazon Linux 2023 production host (glibc 2.34).
          python -m pip install ziglang==0.14.1
          cargo install cargo-zigbuild --version 0.23.4 --locked
      - name: Build only the API
        run: |
          test "$(uname -m)" = aarch64
          cargo zigbuild --release --locked --target aarch64-unknown-linux-gnu.2.34 -p silicon-apps-server --bin apps-server
          mkdir -p dist
          cp target/aarch64-unknown-linux-gnu/release/apps-server dist/apps-server
      - name: Verify ABI and run the exact binary natively
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, platform, re, socket, subprocess, tempfile, time, tomllib, urllib.request

          binary = pathlib.Path('dist/apps-server').resolve()
          raw = binary.read_bytes()
          assert raw[:4] == b'\x7fELF' and raw[4:6] == b'\x02\x01'
          assert int.from_bytes(raw[18:20], 'little') == 183, 'Expected ARM64 ELF'
          versions = subprocess.check_output(['readelf', '--version-info', str(binary)], text=True)
          glibc = sorted({tuple(map(int, v.split('.'))) for v in re.findall(r'GLIBC_(\d+\.\d+(?:\.\d+)?)', versions)})
          assert glibc and max(glibc) <= (2, 34), glibc
          package = tomllib.loads(pathlib.Path('crates/server/Cargo.toml').read_text())['package']
          version = package['version']
          if isinstance(version, dict):
              version = tomllib.loads(pathlib.Path('Cargo.toml').read_text())['workspace']['package']['version']
          with tempfile.TemporaryDirectory(prefix='apps-api-smoke-') as state:
              with socket.socket() as listener:
                  listener.bind(('127.0.0.1', 0))
                  port = listener.getsockname()[1]
              origin = f'http://127.0.0.1:{port}'
              env = dict(os.environ, APPS_DATA_DIR=state, APPS_BIND=f'127.0.0.1:{port}', APPS_PUBLIC_URL=origin,
                         APPS_ALLOWED_ORIGINS=origin, APPS_DEV_AUTH='1', APPS_IMPORT_ACCOUNTS='0',
                         APPS_ACCOUNTS_URL='http://127.0.0.1:9')
              with open(pathlib.Path(state)/'server.log', 'w+') as log:
                  process = subprocess.Popen([str(binary)], env=env, stdout=log, stderr=log)
                  try:
                      for attempt in range(60):
                          assert process.poll() is None, 'API exited before readiness'
                          try:
                              with urllib.request.urlopen(origin+'/health', timeout=2) as response:
                                  health = json.load(response)
                              assert health['version'] == version and health['status'] == 'ok', health
                              break
                          except OSError:
                              time.sleep(.5)
                      else:
                          raise AssertionError('API did not become ready')
                  finally:
                      process.terminate()
                      try:
                          process.wait(timeout=10)
                      except subprocess.TimeoutExpired:
                          process.kill()
                          process.wait()
          revision = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert revision == os.environ['SOURCE_COMMIT']
          digest = hashlib.sha256(raw).hexdigest()
          metadata = {'source_commit': revision, 'workflow_run_id': os.environ['GITHUB_RUN_ID'],
                      'workflow_run_attempt': os.environ['GITHUB_RUN_ATTEMPT'], 'version': version,
                      'binary': 'apps-server', 'sha256': digest, 'size': len(raw),
                      'rust': subprocess.check_output(['rustc', '--version'], text=True).strip(),
                      'target': 'aarch64-unknown-linux-gnu', 'glibc_max': '.'.join(map(str, max(glibc))),
                      'runtime': {'system': platform.system(), 'machine': platform.machine(), 'native': True},
                      'health': health}
          pathlib.Path('dist/build.json').write_text(json.dumps(metadata, indent=2)+'\n')
          pathlib.Path('dist/SHA256SUMS').write_text(digest+'  apps-server\n')
          print(json.dumps(metadata, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: apps-server-linux-aarch64-${{ github.event.pull_request.head.sha || github.sha }}
          path: dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
